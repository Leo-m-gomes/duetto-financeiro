<!--
═══════════════════════════════════════════════════════════════════════════
  DUETTO FINANCEIRO, view upload.html
═══════════════════════════════════════════════════════════════════════════
  Fragmento HTML carregado dinamicamente pelo router.js no container
  #appMain. Sem <html>, <head>, <body>, <script>.

  Conteúdo: extração LITERAL das linhas 338-402 do index.html legado.

  ⚠ AUDITORIA DETECTOU NO LEGADO:
  O bloco <div class="page" id="page-upload"> aparece DUPLICADO no
  index.html legado, idêntico nas linhas 338-402 e 876-940. IDs
  duplicados no DOM são bug grave: getElementById retorna apenas o
  primeiro, deixando o segundo "morto". Resultado prático: nenhum
  efeito visual aparente, mas DOM poluído e mais lento.

  Esta view extrai APENAS o primeiro bloco (canônico, em uso real).
  Quando o shell for ativado, o legado index.html será aposentado e
  a duplicação desaparece naturalmente.

  ROTA RESTRITA: páginas Upload Cards são adminOnly:true em
  ROUTES (router.js). Apenas Leo acessa.

  IDs consultados por js/upload.js:
    upAlertErr, upAlertOk, upAlertAv, upAlertVal, upZone, upFileInput,
    upFileInfo, upFileName, upFileDetail, upFileId, upHistorico,
    upSecaoPreview, upStats, upResumoArquivo, upLayout, upAbas, upBusca,
    upAgrupar, upLista, upPainel, upTotal, upBarraInfo, upBarraPend,
    upBtnConfirmar.

  PRÉ-VISUALIZAÇÃO (bloco #upSecaoPreview, estilos em css/upload.css):
    lista de leitura em duas linhas por conta, agrupada (situação, categoria
    ou responsável), e painel lateral de edição da linha selecionada. No
    celular o painel vira folha inferior. Barra fixa com total e confirmação.

  Classes preservadas: page, page-inner, overdue-alert, up-grid,
  section-card, section-header, up-zone.
═══════════════════════════════════════════════════════════════════════════
-->

  <div class="page" id="page-upload">
    <div class="page-inner">
      <div id="upAlertErr" class="overdue-alert alert-err" style="display:none"></div>
      <div id="upAlertOk"  class="overdue-alert alert-ok" style="display:none;cursor:default"></div>
      <div id="upAlertAv"  class="overdue-alert alert-av" style="display:none;cursor:default"></div>
      <div class="up-grid">
        <div class="section-card">
          <div class="section-header">
            <h3>📤 Upload da Planilha</h3>
            <div style="display:flex;gap:7px">
              <button class="btn btn-secondary btn-sm" onclick="APP.openUpModal('ovCartoes')">🃏 Cartões</button>
              <button class="btn btn-primary btn-sm" onclick="APP.openUpModal('ovModelo')">⬇ Baixar Modelo</button>
            </div>
          </div>
          <div style="padding:16px">
            <div class="up-zone" id="upZone" onclick="document.getElementById('upFileInput').click()" ondragover="APP.upDragOver(event)" ondragleave="APP.upDragLeave()" ondrop="APP.upDrop(event)">
              <div style="font-size:36px;margin-bottom:10px">📊</div>
              <p style="color:var(--t3);font-size:13px;margin-bottom:6px">Arraste a planilha aqui ou clique para selecionar</p>
              <strong style="color:var(--palm);font-size:12.5px">Aceita: .xlsx gerado pelo sistema</strong>
            </div>
            <input type="file" id="upFileInput" accept=".xlsx,.xls" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none" onchange="APP.upHandleFile(this.files[0])">
            <div id="upFileInfo" class="callout callout-success" style="display:none;margin-top:12px;padding:10px 14px;border-left-width:1px">
              <strong>📄 <span id="upFileName"></span></strong><br>
              <span id="upFileDetail"></span><br>
              <span style="font-family:monospace;font-size:10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 6px;color:var(--t4)" id="upFileId"></span>
            </div>
          </div>
        </div>
        <div class="section-card">
          <div class="section-header"><h3>📋 Importações Registradas</h3></div>
          <div style="padding:16px">
            <p style="font-size:12px;color:var(--t3);margin-bottom:10px">Histórico completo no banco. Bloqueio por ID exclusivo — renomear o arquivo não contorna a validação.</p>
            <div id="upHistorico"></div>
            <div style="display:flex;gap:8px;margin-top:10px">
              <button class="btn btn-ghost btn-sm" onclick="APP.upToggleHist()">Ver todas</button>
            </div>
          </div>
        </div>
      </div>
      <!-- Pré-visualização: lista de leitura + painel de edição (css/upload.css).
           Conteúdo montado por APP._upRenderPreview (js/upload.js). -->
      <div id="upSecaoPreview" class="upr" style="display:none">
        <div class="upr-head">
          <h3 class="upr-tit">Revisar importação</h3>
          <span class="upr-arq" id="upResumoArquivo" hidden></span>
          <div class="upr-stats" id="upStats" aria-live="polite"></div>
        </div>
        <div id="upAlertVal" class="overdue-alert alert-err" style="display:none;cursor:default"></div>
        <div class="upr-layout" id="upLayout">
          <section class="upr-lista" aria-label="Contas da planilha">
            <div class="upr-tools">
              <div class="upr-abas" id="upAbas" role="group" aria-label="Filtrar contas"></div>
              <label class="upr-busca">
                <svg class="upr-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="search" id="upBusca" placeholder="Filtrar…" aria-label="Filtrar por descrição, nota, categoria ou forma" autocomplete="off" oninput="APP.upBuscar(this.value)">
              </label>
              <label class="upr-agrupar">
                <span>Agrupar:</span>
                <select id="upAgrupar" onchange="APP.upAgrupar(this.value)">
                  <option value="situacao">Situação</option>
                  <option value="cat">Categoria</option>
                  <option value="resp">Responsável</option>
                </select>
              </label>
            </div>
            <div id="upLista" class="upr-linhas" onkeydown="APP._upTeclaLista(event)"></div>
          </section>
          <div class="upr-fundo" onclick="APP.upFecharPainel()" aria-hidden="true"></div>
          <aside class="upr-painel" id="upPainel" aria-label="Editar conta" onkeydown="APP._upTeclaPainel(event)"></aside>
        </div>
        <div class="upr-barra" id="upBarra">
          <div class="upr-barra-tot">
            <span>Total das linhas</span>
            <strong id="upTotal"></strong>
          </div>
          <div class="upr-barra-info" id="upBarraInfo"></div>
          <button type="button" class="upr-barra-pend" id="upBarraPend" onclick="APP.upFiltrar('revisar')" hidden></button>
          <span class="upr-sp"></span>
          <button type="button" class="btn btn-ghost upr-btn-cancel" onclick="APP.upCancelar()" aria-label="Cancelar importação" title="Cancelar importação">
            <svg class="upr-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg><span>Cancelar importação</span>
          </button>
          <button type="button" class="btn btn-primary" onclick="APP.upConfirmar()" id="upBtnConfirmar">Confirmar cadastro</button>
        </div>
      </div>
    </div>
  </div>
