<!--
═══════════════════════════════════════════════════════════════════════════
  DUETTO FINANCEIRO, view dashboard.html
═══════════════════════════════════════════════════════════════════════════
  Fragmento HTML carregado dinamicamente pelo router.js no container
  #appMain do shell. NÃO contém <html>, <head>, <body> nem <script>.

  Conteúdo: extração LITERAL do bloco #page-dashboard do index.html legado
  (linhas 132-192), preservando IDs, classes e onclick handlers para que
  o pipeline existente (APP.renderDashboard, etc.) continue funcionando.

  ATENÇÃO:
   • IDs preservados: filtroAnoDash, filtroMesDash, periodoBadgeDash,
     rc-todos, rc-leo, rc-pri, dashInfoBanner, kpiGrid, insightBar,
     pendentesCount, tblPendentes, tbodyPendentes, canvasCategoria,
     canvasFluxo, canvasParetoDash, paretoTableDash.
   • Classes preservadas: page, page-inner, dash-page-inner, dash-filters,
     dash-order-* (ordem mobile), kpi-grid, insight-bar, section-card,
     dash-pendentes-card, charts-row, chart-card, pareto-card, pareto-layout.
═══════════════════════════════════════════════════════════════════════════
-->

<div class="page active" id="page-dashboard">
  <div class="page-inner dash-page-inner">

    <!-- FILTROS, colapsáveis no mobile (item 3) -->
    <div class="dash-filters" id="dashFiltersWrapper">
      <button class="mob-filter-toggle dash-filter-toggle" id="btnDashFiltros" onclick="APP.toggleDashFiltros()">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Filtros
        <svg id="iconDashFiltros" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="dash-filters-body" id="dashFiltersBody">
        <div class="dash-filters-top">
          <select class="filter-select" id="filtroAnoDash"></select>
          <select class="filter-select" id="filtroMesDash"></select>
          <button class="btn btn-secondary btn-sm" onclick="APP.openPeriodo('dashboard')">📅 Período</button>
          <span id="periodoBadgeDash" style="display:none;background:var(--palm-lt);color:var(--palm);border:1px solid #c6e8d4;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:600;cursor:pointer" onclick="APP.limparPeriodo('dashboard')" title="Clique para remover"></span>
        </div>
        <div class="dash-filters-resp">
          <span style="font-size:11px;color:var(--t4);font-weight:600">Filtrar:</span>
          <button class="resp-chip active" id="rc-todos" onclick="APP.setRespDash('')">Todos</button>
          <button class="resp-chip" id="rc-leo" onclick="APP.setRespDash('Leo')">Leo</button>
          <button class="resp-chip" id="rc-pri" onclick="APP.setRespDash('Pri')">Pri</button>
        </div>
      </div>
    </div>

    <!-- ALERTA DE ATRASO -->
    <div id="dashInfoBanner" style="display:none" class="overdue-alert dash-order-alert" onclick="APP.goPage('contas')"></div>

    <!-- KPIs (item 1: 2x2 no mobile) -->
    <div class="kpi-grid dash-order-kpi" id="kpiGrid"></div>

    <!-- INSIGHTS -->
    <div class="insight-bar dash-order-insights" id="insightBar"></div>

    <!-- PENDENTES, primeiro no mobile (item 2) -->
    <div class="section-card dash-pendentes-card dash-order-pendentes">
      <div class="section-header"><h3>Pendentes do Mês</h3><span class="badge-n" id="pendentesCount">0</span></div>
      <div class="table-wrap"><table class="data-table" id="tblPendentes"><thead><tr><th>Descrição</th><th>Responsável</th><th>Categoria</th><th>Vencimento</th><th>Valor</th><th>Status</th></tr></thead><tbody id="tbodyPendentes"></tbody></table></div>
    </div>

    <!-- GRÁFICOS, depois dos pendentes no mobile (item 2) -->
    <div class="charts-row dash-order-charts">
      <div class="chart-card"><div class="chart-header"><h3>Despesas por Categoria</h3></div><div class="chart-container"><canvas id="canvasCategoria"></canvas></div></div>
      <div class="chart-card"><div class="chart-header"><h3>Receita × Despesa</h3></div><div class="chart-container"><canvas id="canvasFluxo"></canvas></div></div>
    </div>

    <!-- PARETO, Dashboard (sempre visível) -->
    <div class="section-card pareto-card dash-order-charts" style="margin-top:0">
      <div class="section-header">
        <h3>📊 Pareto, Concentração de Despesas (80/20)</h3>
        <span style="font-size:11px;color:var(--t4)">Categorias ordenadas do maior para o menor gasto</span>
      </div>
      <div class="pareto-layout" id="paretoDash">
        <div class="pareto-chart-area"><canvas id="canvasParetoDash"></canvas></div>
        <div class="pareto-table-area" id="paretoTableDash"></div>
      </div>
    </div>

  </div>
</div>
