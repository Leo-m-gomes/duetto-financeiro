<!--
═══════════════════════════════════════════════════════════════════════════
  DUETTO FINANCEIRO, view relatorio.html
═══════════════════════════════════════════════════════════════════════════
  Fragmento HTML carregado dinamicamente pelo router.js no container
  #appMain. Sem <html>, <head>, <body>, <script>.

  Conteúdo: extração LITERAL das linhas 281-335 do index.html legado.

  Esta view é a mais densa em filtros e análises. Ela contém:
    • Filtros avançados (ano, mês, responsável, categoria, forma)
    • Gráficos: Pareto + Histórico mensal + Comparativo Leo vs Pri
    • Tabelas analíticas
    • Botões de exportação (PDF, CSV)

  IDs preservados (lista parcial, consultados por APP.renderRelatorio):
    relFiltroAno, relFiltroMes, relFiltroResp, relCat, relForma,
    btnRelPDF, btnRelCSV, periodoBadge, canvasParetoRel, paretoTableRel,
    canvasHistorico, canvasComparativo, tblPorCategoria, tblPorForma,
    relInfoTotais, relInfoCount.

  Classes preservadas: page, page-inner, mob-filter-toggle, filters-bar,
  filter-input, filter-select, section-card, charts-row, chart-card,
  chart-container, pareto-card, pareto-layout, data-table.
═══════════════════════════════════════════════════════════════════════════
-->

  <div class="page" id="page-relatorio">
    <div class="page-inner">
      <div class="rel-filters-wrap">
        <button class="mob-filter-toggle rel-filter-toggle" id="btnRelFiltros" onclick="APP.toggleRelFiltros()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          Filtros
          <svg id="iconRelFiltros" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="rel-filters-body" id="relFiltersBody">
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <select class="filter-select" id="relAno"></select>
            <select class="filter-select" id="relMes"></select>
            <select class="filter-select" id="relCat"><option value="">Todas as categorias</option></select>
            <select class="filter-select" id="relForma"><option value="">Todas as formas</option></select>
            <select class="filter-select" id="relResp"><option value="">Todos</option><option>Leo</option><option>Pri</option><option>Leo &amp; Pri</option></select>
            <select class="filter-select" id="relStatus"><option value="">Todos os status</option><option value="pago">Pago</option><option value="pendente">Pendente</option><option value="atrasado">Atrasado</option></select>
            <button class="btn btn-secondary btn-sm" onclick="APP.openPeriodo('relatorio')">📅 Período</button>
            <span id="periodoBadge" style="display:none;background:var(--palm-lt);color:var(--palm);border:1px solid var(--palm-border);border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:600;cursor:pointer" onclick="APP.limparPeriodo('relatorio')" title="Clique para remover o filtro de período"></span>
            <button class="btn btn-secondary btn-sm" id="btnCSV">⬇ CSV</button>
            <button class="btn btn-secondary btn-sm" onclick="APP.exportPDF()">📄 PDF</button>
          </div>
        </div>
      </div>
      <div class="rel-kpis" id="relKpis"></div>
      <div class="section-card"><div class="table-wrap"><table class="data-table"><thead><tr>
        <th class="th-sort" onclick="APP.sortTable('rel','#')">#<span class="sort-icon" data-col="#"></span></th>
        <th class="th-sort" onclick="APP.sortTable('rel','conta')">Descrição<span class="sort-icon" data-col="conta"></span></th>
        <th class="th-sort" onclick="APP.sortTable('rel','resp')">Resp.<span class="sort-icon" data-col="resp"></span></th>
        <th class="th-sort" onclick="APP.sortTable('rel','forma')">Forma<span class="sort-icon" data-col="forma"></span></th>
        <th class="th-sort" onclick="APP.sortTable('rel','cat')">Cat.<span class="sort-icon" data-col="cat"></span></th>
        <th class="th-sort" onclick="APP.sortTable('rel','vPagar')">A Pagar<span class="sort-icon" data-col="vPagar"></span></th>
        <th class="th-sort" onclick="APP.sortTable('rel','vPago')">Pago<span class="sort-icon" data-col="vPago"></span></th>
        <th>Pendente</th>
        <th class="th-sort" onclick="APP.sortTable('rel','data')">Vencimento<span class="sort-icon" data-col="data"></span></th>
        <th class="th-sort" onclick="APP.sortTable('rel','parcela')">Parcela<span class="sort-icon" data-col="parcela"></span></th>
        <th>Por</th><th>Nota</th>
      </tr></thead><tbody id="tbodyRel"></tbody></table></div></div>

      <!-- PARETO — Relatório (com toggle) -->
      <div class="section-card pareto-card" style="margin-top:14px">
        <div class="section-header">
          <h3>📊 Pareto — Concentração de Despesas (80/20)</h3>
          <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;color:var(--t3)">
            <input type="checkbox" id="chkParetoRel" onchange="APP.toggleParetoRel()" checked style="accent-color:var(--palm);width:14px;height:14px">
            Exibir gráfico
          </label>
        </div>
        <div id="paretoRelWrap">
          <div class="pareto-layout" id="paretoRel">
            <div class="pareto-chart-area"><canvas id="canvasParetoRel"></canvas></div>
            <div class="pareto-table-area" id="paretoTableRel"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
