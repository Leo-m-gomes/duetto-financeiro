<!--
═══════════════════════════════════════════════════════════════════════════
  DUETTO FINANCEIRO, view receitas.html (Redesign v2 — padrão Contas)
═══════════════════════════════════════════════════════════════════════════
  Layout tabular com filtros, totalizadores, tabela paginada com
  ordenação e gráfico. Substitui a versão matricial 12 colunas.

  IDs: searchReceitas, filtroMesReceitas, filtroRespReceitas,
       filtroTipoReceitas, totalReceitas, totalSalarios, totalOutras,
       receitasInfo, tblReceitas, tbodyReceitas, pgReceitas, canvasReceitas.

  Classes preservadas: page, page-inner, filters-bar, filter-group,
  filter-input, filter-select, totals-bar, total-pill, section-card,
  table-wrap, data-table, th-sort, sort-icon, table-pagination,
  chart-container.
═══════════════════════════════════════════════════════════════════════════
-->

<div class="page" id="page-receitas">
  <div class="page-inner">
    <!-- FILTROS -->
    <div class="filters-bar">
      <button class="mob-filter-toggle" onclick="APP.toggleFiltrosReceitas()" id="btnToggleFiltrosReceitas">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Filtros
        <span id="filtrosAtivosCountReceitas" style="display:none;background:var(--palm);color:#fff;border-radius:99px;padding:1px 7px;font-size:10px;font-weight:700"></span>
        <svg id="iconFiltrosReceitas" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="filter-group" id="filterGroupReceitas">
        <input type="text" class="filter-input" id="searchReceitas" placeholder="🔍 Buscar receita...">
        <select class="filter-select" id="filtroMesReceitas"></select>
        <select class="filter-select" id="filtroRespReceitas"><option value="">Todos</option><option>Leo</option><option>Pri</option></select>
        <select class="filter-select" id="filtroTipoReceitas"><option value="">Todas as receitas</option><option value="salario">Salários</option><option value="outra">Outras Receitas</option></select>
      </div>
    </div>

    <!-- TOTALIZADORES -->
    <div class="totals-bar">
      <div class="total-pill blue"><label>Total Receitas</label><div class="val" id="totalReceitas">R$ 0</div></div>
      <div class="total-pill green"><label>Salários</label><div class="val" id="totalSalarios">R$ 0</div></div>
      <div class="total-pill orange"><label>Outras Receitas</label><div class="val" id="totalOutras">R$ 0</div></div>
    </div>

    <span style="font-size:11.5px;color:var(--t4);display:block;margin-bottom:8px" id="receitasInfo"></span>

    <!-- TABELA -->
    <div class="section-card">
      <div class="table-wrap"><table class="data-table" id="tblReceitas"><thead><tr>
        <th class="th-sort" onclick="APP.sortTable('receitas','tipo')">Tipo<span class="sort-icon" data-col="tipo"></span></th>
        <th class="th-sort" onclick="APP.sortTable('receitas','desc')">Descrição<span class="sort-icon" data-col="desc"></span></th>
        <th class="th-sort" onclick="APP.sortTable('receitas','resp')">Responsável<span class="sort-icon" data-col="resp"></span></th>
        <th class="th-sort" onclick="APP.sortTable('receitas','mes')">Mês<span class="sort-icon" data-col="mes"></span></th>
        <th class="th-sort" onclick="APP.sortTable('receitas','valor')" style="text-align:right">Valor<span class="sort-icon" data-col="valor"></span></th>
        <th>Por</th>
        <th>Ações</th>
      </tr></thead><tbody id="tbodyReceitas"></tbody></table></div>
      <div class="table-pagination" id="pgReceitas"></div>
    </div>

    <!-- GRÁFICO -->
    <div class="section-card" style="margin-top:16px">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
        <h3 style="font-family:var(--font-d);font-size:14px;font-weight:700;color:var(--t1)">📈 Resumo Anual</h3>
      </div>
      <div style="padding:16px"><div class="chart-container"><canvas id="canvasReceitas"></canvas></div></div>
    </div>
  </div>
</div>
